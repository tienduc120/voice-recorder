<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Voice Recorder</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="deck">
    <header class="brand">
      <h1>Voice Recorder</h1>
      <button id="quit" class="close" type="button" aria-label="Quit" title="Quit"></button>
    </header>

    <section class="display" aria-label="Recorder">
      <div class="display-head">
        <span id="state" class="state idle">Standby</span>
        <span class="display-hint" aria-hidden="true">48 kHz · mono · Opus</span>
      </div>
      <div id="timer" class="timer">00:00:00</div>
      <div id="level" class="meter" role="meter" aria-label="Input level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="meter-cells"></span>
        <span class="meter-peak" aria-hidden="true"></span>
      </div>
      <div class="meter-scale" aria-hidden="true">
        <span>−60</span><span>−45</span><span>−30</span><span>−15</span><span>0 dB</span>
      </div>
      <p id="notice" class="notice" role="status"></p>
      <p id="last" class="last"></p>
    </section>

    <section class="transport" aria-label="Transport">
      <button id="pause" class="key" type="button">
        <span class="glyph glyph-pause" aria-hidden="true"></span>
        <span class="key-label">Pause</span>
      </button>
      <button id="start" class="key key-rec" type="button">
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="key-label">Record</span>
      </button>
      <button id="stop" class="key" type="button">
        <span class="glyph glyph-stop" aria-hidden="true"></span>
        <span class="key-label">Stop</span>
      </button>
    </section>

    <section class="setup" aria-label="Settings">
      <div class="field field-wide">
        <label for="folder">Save to</label>
        <div class="field-row">
          <input id="folder" type="text" spellcheck="false" autocomplete="off">
          <button id="browse" class="small" type="button">Browse</button>
          <button id="open-folder" class="small" type="button" title="Show this folder in File Explorer">Open</button>
        </div>
      </div>
      <div class="field field-wide">
        <label for="mic">Microphone</label>
        <select id="mic"></select>
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" autocomplete="off">
      </div>
      <div class="field field-switch">
        <label for="cleanup">Noise cleanup</label>
        <input id="cleanup" class="switch" type="checkbox" role="switch">
      </div>
    </section>
  </main>
</body>
</html>
